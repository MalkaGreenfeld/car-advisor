# The names are Hebrew because employees type their occupation in Hebrew. A name with a slash stands for
# both genders: "מפתח/ת תוכנה" matches "מפתח תוכנה" and "מפתחת תוכנה". Matching trims whitespace at the
# ends only.
# group is the employee's eligibility group: the advisor takes it from the occupation and never asks for it.
# car_mandatory is the sheet's own column. Such an occupation has no waiver and no Today without a car.
