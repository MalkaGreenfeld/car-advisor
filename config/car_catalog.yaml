# Quote every code: YAML reads an unquoted 00001 as the number 1, and the schema rejects it.
mock_data: "MOCK DATA - the challenge's catalog of 2026-10-12. The costs and the participations are fictitious, the codes and the usage values are real. To use Strauss's catalog, replace this file with it in the same format."
# The sheet puts the two family-track cars in a group of their own. Here they are in group A, so that the group filter
# shows them to every employee; the number of children decides who may take them.
# monthly_cost is the cost to the company. For a family-track car it sets the gap above the budget.
# default_participation is the participation of a new car until the representative gives another amount.
# usage_value is the sheet's value, only a check: the app warns when it differs from the dataset, and always
# calculates with the dataset's value.
cars:
  - display_name: "Kia Picanto"
    official_key:
      tax_year: 2026
      registration_year: 2025
      vehicle_type_code: "1"
      manufacturer_code: "00885"
      model_code: "00643"
    monthly_cost: 2650
    default_participation: 150
    usage_value: 2690
    group: A
    family_track: false

