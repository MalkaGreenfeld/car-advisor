# Installed as conf.d/default.conf. The stock nginx.conf includes it inside its http block.

server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript image/svg+xml;

# Angular puts a hash of the content in the name of each file it builds, except index.html and
# the favicon. A file with a hashed name never changes, so browsers keep it for a year.
# index.html is checked on every visit, because it names the current files.
map $uri $cache_control {
    default "";
    /index.html "no-cache";
    "~-[A-Z0-9]{8}\.(?:js|css|woff2)$" "public, max-age=31536000, immutable";
}

server {
    # 8080 and not 80: on some hosts a connection from the host to port 80 of a bridge container
    # hangs, and compose publishes this port as 127.0.0.1:8080.
    listen 8080;
    root /usr/share/nginx/html;

    # A 10 MB upload plus the multipart overhead.
    client_max_body_size 11m;

    # Angular adds the styles of its components to the page at run time, as <style> elements, and
    # a policy that allows only 'self' for styles blocks them. A nonce that is new for every
    # request lets those elements through and nothing else inline. It goes into the header below
    # and, as ngCspNonce on <app-root>, into index.html, where Angular reads it and puts it on
    # every <style>. sub_filter removes ETag and Last-Modified from index.html, so a browser never
    # keeps an old copy of it (with an old nonce) next to a new header.
    sub_filter '<app-root' '<app-root ngCspNonce="$request_id"';
    sub_filter_once on;

    # Declared here only. An add_header in a location would replace all of these, so no location
    # has one. Cache-Control has no "always", so a 404 is never cached for a year, and an empty
    # value (an API route) is not sent.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'nonce-$request_id'; font-src 'self'; connect-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $cache_control;

    # Docker's DNS server. The backend can get a new address when it restarts, so the name is
    # resolved again every 10 s. A name in a variable is resolved at run time, which also lets
    # nginx start while the backend is down: nginx refuses to start when a literal name given
    # to proxy_pass does not resolve.
    resolver 127.0.0.11 valid=10s;

    # With ^~ the file rule below does not apply to API paths.
    location ^~ /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_read_timeout 90s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # A path with a file extension is a file and never a route of the app, so a missing script
    # gets a 404 and not index.html.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
