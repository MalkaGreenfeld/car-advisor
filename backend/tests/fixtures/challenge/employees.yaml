      current_car_key: "2026-2025-1-00588-00446"   # Mazda 3
      current_car_participation: 350
    alternative: {kind: waiver}     # the maintenance is 2,000
    today: {net_pay: 14244, income_tax: 6593, insurance: 3248}
    after: {net_pay: 17806, income_tax: 5694, insurance: 2935}
    difference: 3562

  - id: E-006
    question: "אם אעבור מהאוקטביה לטסלה מודל 3 - מה יקרה לנטו?"
    sheet_group: D      # the sheet's group; the advisor takes it from the occupation
    profile:
      occupation: "מנהל/ת מחלקה"
      base_salary: 32000
      pay_components:
        - {kind: bonus, label: Bonus, amount: 2000}
      pension_rate_percent: 6
      study_fund_rate_percent: 2.5
      credit_points: 2.25
      children_under_23: 4
      has_current_car: true
      current_car_key: "2026-2025-1-00676-01455"   # Skoda Octavia
      current_car_participation: 500
    alternative: {kind: car, car_key: "2026-2025-1-01327-00730"}   # Tesla Model 3
    today: {net_pay: 17073, income_tax: 9367, insurance: 4170}
    after: {net_pay: 17794, income_tax: 9183, insurance: 4106}
    after_taxes_include_gross_up: true
    difference: 721
